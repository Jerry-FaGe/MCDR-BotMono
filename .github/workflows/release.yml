name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bot-mono-${{ github.sha }}
          path: dist

      - name: Verify checksum and identify prerelease
        id: verify
        working-directory: dist
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check --strict SHA256SUMS
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate commit-based release notes
        id: changelog
        uses: mikepenz/release-changelog-builder-action@b0db9d18b53447ef9f940a46c8f31653c4d9f621 # v6.5.0
        with:
          mode: COMMIT
          offlineMode: true
          toTag: ${{ github.ref_name }}
          failOnError: true

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.mcdr
            dist/SHA256SUMS
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: ${{ steps.verify.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.verify.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          fail_on_unmatched_files: true
